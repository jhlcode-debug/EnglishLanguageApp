<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#177a4c"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Mum's Daily English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
/* Layout: single centred phone-width column, 3-tab bottom nav, one primary action per screen */
:root{
  --bg:#f6f3ec;
  --surface:#fffdf8;
  --surface2:#f1ede2;
  --ink:#27241d;
  --ink2:#6b665a;
  --muted:#96907f;
  --line:#e7e1d2;
  --accent:#177a4c;
  --accent-ink:#ffffff;
  --accent-soft:#e2f1e8;
  --bar:#88c4a4;
  --gold:#d98e04;
  --gold-soft:#faf0da;
  --danger:#c03d3d;
  --danger-soft:#f9e7e7;
  --l1:#1f9d61; --l2:#2a78d6; --l3:#6246b4; --l4:#c2410c; --lp:#b07508;
  --shadow:0 1px 2px rgba(68,58,36,.06),0 6px 18px rgba(68,58,36,.07);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#201d17; --surface2:#2a261e;
    --ink:#f3efe5; --ink2:#b4ad9c; --muted:#8a8373; --line:#363126;
    --accent:#3dbd7d; --accent-ink:#0c2417; --accent-soft:#1d3528;
    --bar:#2f5d45;
    --gold:#e8a93c; --gold-soft:#372c15;
    --danger:#e06c6c; --danger-soft:#3a2020;
    --l1:#34c184; --l2:#5598e7; --l3:#9a89e8; --l4:#e8824a; --lp:#dba23c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#201d17; --surface2:#2a261e;
  --ink:#f3efe5; --ink2:#b4ad9c; --muted:#8a8373; --line:#363126;
  --accent:#3dbd7d; --accent-ink:#0c2417; --accent-soft:#1d3528;
  --bar:#2f5d45;
  --gold:#e8a93c; --gold-soft:#372c15;
  --danger:#e06c6c; --danger-soft:#3a2020;
  --l1:#34c184; --l2:#5598e7; --l3:#9a89e8; --l4:#e8824a; --lp:#dba23c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Nunito","Noto Sans SC","Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:1.0625rem; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:30rem; margin:0 auto; padding:1rem 1rem 7.5rem; min-height:60vh}
body.nonav #app{padding-bottom:2.5rem}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.25}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:8px}
a{color:var(--accent)}
.zh{display:block; font-size:.82em; font-weight:400; color:var(--ink2); margin-top:.1em}
.zh.inline{display:inline; margin-left:.35em}
body.nozh .zh{display:none}
body.nosound .sndonly{display:none !important}

/* ---------- shared components ---------- */
.card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.1rem 1.15rem; border:1px solid var(--line)}
.stack{display:flex; flex-direction:column; gap:.9rem}
.row{display:flex; align-items:center; gap:.75rem; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.btn{
  display:flex; align-items:center; justify-content:center; gap:.5rem;
  min-height:3.5rem; padding:.6rem 1.2rem; border-radius:18px;
  font-weight:800; font-size:1.15rem; text-align:center; width:100%;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.97)}
.btn .zh{margin-top:0; font-weight:700}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow)}
.btn-primary .zh{color:var(--accent-ink); opacity:.85}
.btn-soft{background:var(--accent-soft); color:var(--accent)}
.btn-soft .zh{color:var(--accent)}
.btn-plain{background:var(--surface); border:2px solid var(--line); color:var(--ink)}
.btn-gold{background:var(--gold-soft); color:var(--gold)}
.btn-gold .zh{color:var(--gold)}
.btn-danger{background:var(--danger-soft); color:var(--danger)}
.btn-danger .zh{color:var(--danger)}
.topbar{display:flex; align-items:center; gap:.6rem; margin-bottom:1rem}
.backbtn{
  display:flex; align-items:center; gap:.35rem; font-weight:800; color:var(--ink2);
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:.5rem .95rem; min-height:2.75rem; font-size:1rem;
}
.screen-title{font-size:1.35rem; font-weight:900}
.eyebrow{font-size:.8rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.chip-group{display:flex; gap:.5rem; flex-wrap:wrap}
.chip{
  border:2px solid var(--line); border-radius:999px; padding:.45rem 1rem;
  font-weight:800; font-size:1rem; min-height:2.75rem; background:var(--surface); color:var(--ink2);
}
.chip .zh{display:inline; margin-left:.3em; font-size:.85em}
.chip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.chip.on .zh{color:var(--accent)}
.speak-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:var(--accent-soft); color:var(--accent); border-radius:999px;
  min-height:3rem; padding:.4rem 1.1rem; font-weight:800; font-size:1.05rem;
}
.speak-btn.small{min-height:2.4rem; padding:.2rem .8rem; font-size:.95rem}
.speak-btn.gold{background:var(--gold-soft); color:var(--gold)}
.mic-zone{margin-top:1.1rem; display:flex; flex-direction:column; gap:.6rem; align-items:center}
.mic-zone .say-row{margin:0}
.mic-res{border-radius:14px; padding:.7rem 1rem; font-weight:800; font-size:1.05rem; max-width:100%}
.mic-res.good{background:var(--accent-soft); color:var(--accent)}
.mic-res.mid{background:var(--gold-soft); color:var(--gold)}
.mic-res.try{background:var(--surface2); color:var(--ink2)}
.mic-res.listening{background:var(--danger-soft); color:var(--danger); animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
body.nomic .miconly{display:none !important}

/* ---------- tab bar ---------- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--line);
  padding:.4rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:center; gap:.25rem;
}
body.nonav #tabbar{display:none}
#tabbar button{
  flex:1; max-width:10rem; display:flex; flex-direction:column; align-items:center; gap:.05rem;
  padding:.35rem .25rem; border-radius:14px; font-weight:800; font-size:.92rem; color:var(--muted);
}
#tabbar button .ico{font-size:1.45rem; line-height:1.2}
#tabbar button.on{color:var(--accent); background:var(--accent-soft)}
#tabbar button .zh{font-size:.78rem; color:inherit; opacity:.8}

/* ---------- home ---------- */
.hello{display:flex; align-items:center; gap:.8rem; margin:.3rem 0 1rem}
.koala{
  width:3.4rem; height:3.4rem; border-radius:50%; background:var(--accent-soft);
  display:flex; align-items:center; justify-content:center; font-size:2rem; flex:none;
}
.koala.logo{background:none; border-radius:26%; overflow:hidden; box-shadow:var(--shadow)}
.koala.logo svg{width:100%; height:100%; display:block}
.hello h1{font-size:1.5rem; font-weight:900}
.hello .date{color:var(--ink2); font-size:.95rem; font-weight:700}
.statrow{display:flex; gap:.9rem}
.statrow .card{flex:1; display:flex; align-items:center; gap:.7rem; padding:.85rem .95rem}
.flame{font-size:1.7rem}
.stat-big{font-size:1.5rem; font-weight:900; line-height:1.1}
.stat-lab{font-size:.85rem; color:var(--ink2); font-weight:700; line-height:1.25}
.ring{flex:none}
.continue-card{border:none; background:var(--accent); color:var(--accent-ink); text-align:left; width:100%; border-radius:var(--radius); box-shadow:var(--shadow); padding:1.15rem 1.2rem}
.continue-card .eyebrow{color:var(--accent-ink); opacity:.75}
.continue-card .zh{color:var(--accent-ink); opacity:.8}
.continue-card .big{font-size:1.45rem; font-weight:900; margin:.2rem 0 .1rem}
.continue-card .sub{opacity:.9; font-weight:700}
.continue-card .go{margin-top:.8rem; background:rgba(255,255,255,.22); border-radius:14px; padding:.6rem; text-align:center; font-weight:900; font-size:1.1rem}
:root[data-theme="dark"] .continue-card .go{background:rgba(0,0,0,.18)}
.pod-card .phrase-en{font-size:1.3rem; font-weight:900; margin:.25rem 0 0}
.pod-card .phrase-zh{color:var(--ink2); font-weight:700}
.nudge{display:flex; gap:.6rem; align-items:flex-start; background:var(--gold-soft); border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem}
.nudge .t{font-weight:800}
.linkbtn{font-weight:800; color:var(--accent); font-size:1rem; min-height:2.5rem; display:inline-flex; align-items:center}

/* ---------- levels ---------- */
.level-card{width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-left:.5rem solid var(--lc,var(--accent)); border-radius:var(--radius); box-shadow:var(--shadow); padding:1rem 1.1rem; display:flex; gap:.85rem; align-items:center}
.level-emoji{font-size:2rem; flex:none}
.level-name{font-weight:900; font-size:1.15rem}
.level-desc{color:var(--ink2); font-size:.92rem; font-weight:700}
.meter{height:.65rem; border-radius:999px; background:var(--surface2); background:color-mix(in srgb, var(--lc,var(--accent)) 16%, var(--surface)); overflow:hidden; margin-top:.45rem}
.meter>i{display:block; height:100%; border-radius:999px; background:var(--lc,var(--accent))}
.level-count{font-size:.85rem; color:var(--muted); font-weight:800; flex:none; text-align:right}
.unit-row{width:100%; text-align:left; display:flex; align-items:center; gap:.8rem; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:.85rem 1rem; box-shadow:var(--shadow)}
.unit-row:disabled{opacity:.45; box-shadow:none}
.unit-emoji{font-size:1.6rem; width:2.6rem; height:2.6rem; border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; flex:none}
.unit-name{font-weight:800; font-size:1.05rem}
.unit-state{flex:none; font-weight:800; color:var(--muted); font-size:1rem}
.stars{color:var(--gold); letter-spacing:.05em}

/* ---------- lesson ---------- */
.lesson-top{display:flex; align-items:center; gap:.8rem; margin-bottom:1.1rem}
.exitbtn{width:2.75rem; height:2.75rem; border-radius:50%; background:var(--surface); border:1px solid var(--line); font-size:1.2rem; font-weight:900; color:var(--ink2); flex:none; display:flex; align-items:center; justify-content:center}
.pbar{flex:1; height:.8rem; border-radius:999px; background:var(--surface2); overflow:hidden}
.pbar>i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease}
.learn-card{text-align:center; padding:1.6rem 1.2rem}
.word-big{font-size:2.4rem; font-weight:900; line-height:1.15; overflow-wrap:break-word}
.word-zh{font-size:1.25rem; color:var(--ink2); font-weight:700; margin-top:.2rem}
.say-row{display:flex; justify-content:center; gap:.7rem; margin:1.1rem 0 .3rem; flex-wrap:wrap}
.example{background:var(--surface2); border-radius:14px; padding:.8rem .9rem; margin-top:1.1rem; text-align:left; display:flex; gap:.6rem; align-items:flex-start}
.example .eg-en{font-weight:700}
.example .eg-zh{color:var(--ink2); font-size:.92rem}
.hintline{margin-top:.9rem; color:var(--muted); font-weight:700; font-size:.95rem}
.counter{color:var(--muted); font-weight:800; font-size:.95rem}
.q-prompt{font-weight:800; color:var(--ink2); font-size:1.05rem}
.q-word{font-size:2rem; font-weight:900; margin:.3rem 0 .2rem; overflow-wrap:break-word}
.opts{display:flex; flex-direction:column; gap:.7rem; margin-top:1rem}
.opt{
  background:var(--surface); border:2px solid var(--line); border-radius:16px;
  min-height:3.4rem; padding:.6rem 1rem; font-weight:800; font-size:1.15rem; text-align:center;
  box-shadow:var(--shadow);
}
.opt.right{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.opt.wrong{border-color:var(--danger); background:var(--danger-soft); color:var(--danger)}
.opt:disabled{cursor:default}
.tilebox{display:flex; flex-wrap:wrap; gap:.5rem; min-height:3.2rem; padding:.6rem; border-radius:14px; background:var(--surface2); margin-top:.9rem; align-items:flex-start}
.tilebox.answer{background:var(--surface); border:2px dashed var(--line)}
.tile{background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:.4rem .75rem; font-weight:800; font-size:1.1rem; box-shadow:var(--shadow); min-height:2.75rem}
.tilebox.answer .tile{border-color:var(--accent)}
.feedback{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));
  border-top-left-radius:22px; border-top-right-radius:22px; box-shadow:0 -6px 24px rgba(0,0,0,.15);
}
.feedback .inner{max-width:30rem; margin:0 auto}
.feedback.good{background:var(--accent-soft)}
.feedback.bad{background:var(--danger-soft)}
.feedback .fb-title{font-size:1.25rem; font-weight:900}
.feedback.good .fb-title{color:var(--accent)}
.feedback.bad .fb-title{color:var(--danger)}
.feedback .fb-ans{font-weight:800; margin:.15rem 0 .5rem}
.fb-btn{min-height:3.25rem; border-radius:16px; width:100%; font-weight:900; font-size:1.15rem}
.feedback.good .fb-btn{background:var(--accent); color:var(--accent-ink)}
.feedback.bad .fb-btn{background:var(--danger); color:#fff}
.done-wrap{text-align:center; padding:2.2rem 0 1rem}
.done-emoji{font-size:4rem}
.done-stars{font-size:2.6rem; color:var(--gold); letter-spacing:.1em; margin:.4rem 0}
.done-stars .off{opacity:.25}
@keyframes pop{0%{transform:scale(.3); opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1); opacity:1}}
.done-stars span{display:inline-block; animation:pop .5s ease both}
.done-stars span:nth-child(2){animation-delay:.15s}
.done-stars span:nth-child(3){animation-delay:.3s}
.done-line{font-weight:800; font-size:1.2rem}
.done-sub{color:var(--ink2); font-weight:700}

/* ---------- progress ---------- */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem}
.tile-stat{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:.75rem .6rem; text-align:center}
.tile-stat .v{font-size:1.45rem; font-weight:900; line-height:1.15}
.tile-stat .l{font-size:.8rem; color:var(--ink2); font-weight:700; line-height:1.3}
.hero-streak{display:flex; align-items:center; gap:1rem; padding:1.1rem 1.2rem}
.hero-streak .n{font-size:3rem; font-weight:900; line-height:1}
.chart-readout{font-weight:800; color:var(--ink2); font-size:.98rem; margin-bottom:.4rem}
.chart-readout b{color:var(--ink)}
svg text{font-family:inherit}
.lvl-progress{display:flex; flex-direction:column; gap:.8rem}
.lvl-progress .nm{font-weight:800; font-size:1rem}
.lvl-progress .ct{color:var(--muted); font-weight:800; font-size:.88rem; flex:none}

/* ---------- settings ---------- */
.set-group{display:flex; flex-direction:column; gap:.55rem}
.set-label{font-weight:800; font-size:1.02rem}
.set-help{color:var(--ink2); font-size:.9rem; font-weight:600}
input[type=time]{
  font:inherit; font-weight:800; font-size:1.2rem; color:var(--ink);
  background:var(--surface2); border:2px solid var(--line); border-radius:14px;
  padding:.5rem .8rem; min-height:3.2rem; width:9.5rem;
}
.divider{border:none; border-top:1px solid var(--line); margin:.35rem 0}
.heart{color:var(--danger)}

/* ---------- welcome ---------- */
.welcome{min-height:82vh; display:flex; flex-direction:column; justify-content:center; gap:1.2rem; text-align:center; padding:1rem 0}
.welcome .koala{width:5.5rem; height:5.5rem; font-size:3.2rem; margin:0 auto}
.welcome h1{font-size:1.9rem; font-weight:900}
.welcome .sub{color:var(--ink2); font-weight:700; font-size:1.1rem}
.level-pick{display:flex; flex-direction:column; gap:.7rem; text-align:left}
.wdots{display:flex; gap:.45rem; justify-content:center}
.wdots i{width:.55rem; height:.55rem; border-radius:50%; background:var(--line)}
.wdots i.on{background:var(--accent)}

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; transform:translateX(-50%) translateY(1rem);
  bottom:calc(6.5rem + env(safe-area-inset-bottom,0px)); z-index:60;
  background:var(--ink); color:var(--bg); font-weight:800; font-size:1rem;
  padding:.7rem 1.2rem; border-radius:999px; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  max-width:min(90vw,26rem); text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#toast .zh{display:inline; margin-left:.4em; color:inherit; opacity:.85}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>

<div id="app" aria-live="polite"></div>
<nav id="tabbar" aria-label="Main">
  <button data-a="tab:home" id="tab-home"><span class="ico">🏠</span>Today<span class="zh">今天</span></button>

  <button data-a="tab:progress" id="tab-progress"><span class="ico">📈</span>Progress<span class="zh">进度</span></button>
</nav>
<div id="toast" role="status"></div>

const ALL_LEVELS=[...LEVELS,PHRASES];
const WORD={};       // id -> {en,zh,eg,egZh,unit}
const UNIT={};       // id -> unit (+level ref)
ALL_LEVELS.forEach(L=>L.units.forEach(u=>{u.level=L; UNIT[u.id]=u;
  u.words.forEach((w,i)=>{WORD[u.id+":"+i]={id:u.id+":"+i,en:w[0],zh:w[1],eg:w[2],egZh:w[3],unit:u};});
}));
const PHRASE_LIST=PHRASES.units.flatMap(u=>u.words.map((w,i)=>u.id+":"+i));

/* ============================================================

   ============================================================ */
const KEY="mumsDailyEnglish.v1";
const DEFAULTS={set:{zh:1,sound:1,big:0,goal:10,rate:.9,level:"l1",remind:"09:00",mic:1},
  first:1, words:{}, units:{}, days:{}, created:""};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=load();
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const s=JSON.parse(raw);
    return {...clone(DEFAULTS),...s,set:{...DEFAULTS.set,...(s.set||{})}};}}catch(e){}
  return clone(DEFAULTS);
}
let saveT=null;
function save(){clearTimeout(saveT); saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},400);}

const UI={screen:"home",tab:"home",level:null,wstep:0,chartSel:6,confirmReset:0};
let L=null; // live lesson

/* ---------- date helpers ---------- */
function ymd(d){d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ymd();}
function day(off){const d=new Date(); d.setDate(d.getDate()+off); return d;}
function dayRec(k){k=k||today(); if(!S.days[k])S.days[k]={s:0,w:0,l:0,r:0}; return S.days[k];}
const WD_EN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const WD_ZH=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const MO_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

/* ---------- streak / stats ---------- */
function isActive(r){return !!r && ((r.l||0)+(r.r||0)>0 || (r.s||0)>=180);}
function streak(){
  const doneToday=isActive(S.days[today()]);
  let n=0,d=new Date(); d.setDate(d.getDate()-1);
  while(isActive(S.days[ymd(d)])){n++; d.setDate(d.getDate()-1);}
  return {n:doneToday?n+1:n, doneToday};
}
function wordsLearned(){return Object.keys(S.words).length;}
function lessonsDone(){return Object.values(S.units).filter(u=>u.done).length;}
function totalMin(){return Math.round(Object.values(S.days).reduce((a,r)=>a+(r.s||0),0)/60);}
function dueWords(){const t=today(); return Object.keys(S.words).filter(id=>S.words[id].due<=t && WORD[id]);}
function unitDone(id){return !!(S.units[id]&&S.units[id].done);}
function unitUnlocked(u){
  if(u.level.id==="px")return true;
  const i=u.level.units.indexOf(u);
  return i===0 || unitDone(u.level.units[i-1].id);
}
function levelPct(L){const d=L.units.filter(u=>unitDone(u.id)).length; return {d,n:L.units.length,pct:Math.round(d/L.units.length*100)};}
function nextUnit(){
  const start=ALL_LEVELS.findIndex(l=>l.id===S.set.level);
  const order=[...LEVELS.slice(Math.max(0,start)),...LEVELS.slice(0,Math.max(0,start))];
  for(const l of order){for(const u of l.units){if(!unitDone(u.id))return u;}}
  for(const u of PHRASES.units){if(!unitDone(u.id))return u;}
  return null;
}

/* ---------- audio: speech + feedback sounds ---------- */
const synth=window.speechSynthesis||null;
let VOICE=null,voiceTried=0;
function pickVoice(){
  if(!synth)return null;
  const vs=synth.getVoices(); if(!vs.length)return null;
  const en=vs.filter(v=>/^en[-_]/i.test(v.lang)||v.lang==="en");
  const pref=["en-AU","en-GB","en-US"];
  for(const p of pref){const hit=en.find(v=>v.lang.replace("_","-").startsWith(p)); if(hit)return hit;}
  return en[0]||null;
}
if(synth)synth.addEventListener?.("voiceschanged",()=>{VOICE=pickVoice();});
let curUtter=null;
function speak(text,rate){
  if(!synth||!text)return;
  try{
    synth.cancel();
    if(!VOICE&&voiceTried<20){VOICE=pickVoice();voiceTried++;}
    const u=new SpeechSynthesisUtterance(text.replace(/—/g,", "));
    u.lang=VOICE?VOICE.lang:"en-AU"; if(VOICE)u.voice=VOICE;
    u.rate=rate||S.set.rate; u.pitch=1;
    curUtter=u; // hold a reference so the browser can't garbage-collect it mid-speech (goes silent)
    u.onend=u.onerror=()=>{if(curUtter===u)curUtter=null;};
    try{if(synth.paused)synth.resume();}catch(e){} // nudge out of the stuck-paused state some browsers fall into
    synth.speak(u);
  }catch(e){}
}
let AC=null;
function ding(ok){
  if(!S.set.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const notes=ok?[[660,0,.09],[990,.1,.16]]:[[220,0,.22]];
    notes.forEach(([f,off,durr])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+off); g.gain.exponentialRampToValueAtTime(.12,t+off+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+off+durr);
      o.connect(g).connect(AC.destination); o.start(t+off); o.stop(t+off+durr+.02);
    });
  }catch(e){}
}

/* ---------- speaking practice (speech recognition) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const MIC={state:"idle",res:null,heard:""};
function micAvailable(){return !!SR&&S.set.mic!==0;}
function micReset(){MIC.state="idle";MIC.res=null;MIC.heard="";}
const HOMO=[["one","won","1"],["two","to","too","2"],["three","3"],["four","for","4","fore"],["five","5"],["six","6"],["seven","7"],["eight","ate","8"],["nine","9"],["ten","10"],["no","know"],["new","knew"],["right","write"],["red","read"],["blue","blew"],["meet","meat"],["son","sun"],["week","weak"],["see","sea"],["hi","high"],["bye","by","buy"],["tea","t"],["hear","here"],["wear","where"],["i","eye"],["our","hour"]];
function canonTok(w){for(const g of HOMO){if(g.includes(w))return g[0];}return w;}
function normSp(s){return String(s).toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();}
function toksSp(s){return normSp(s).split(" ").filter(Boolean).map(canonTok);}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function simTok(a,b){a=canonTok(a);b=canonTok(b);if(a===b)return 1;return 1-lev(a,b)/Math.max(a.length,b.length);}
function scoreSpeech(alt,target){
  if(normSp(alt)===normSp(target))return 1;
  const T=toksSp(target),A=toksSp(alt);
  if(!T.length||!A.length)return 0;
  const used=new Array(A.length).fill(false);
  let total=0;
  for(const t of T){
    let best=0,bi=-1;
    A.forEach((a,i)=>{if(used[i])return;const s=simTok(t,a);if(s>best){best=s;bi=i;}});
    if(bi>=0&&best>=0.6){used[bi]=true;total+=best;}
  }
  return total/T.length;
}
function bestScore(alts,target){let b=0;for(const a of alts){b=Math.max(b,scoreSpeech(a,target));}return b;}
let recTimer=null,recHardTimer=null;
function startListen(target){
  if(!micAvailable()||MIC.state==="listening")return;
  try{if(synth)synth.cancel();}catch(e){}
  let rec;
  try{rec=new SR();}catch(e){MIC.state="idle";MIC.res="retry";render();return;}
  rec.lang=(VOICE&&VOICE.lang)||"en-AU";
  rec.interimResults=false; rec.maxAlternatives=5; rec.continuous=false;
  MIC.state="listening"; MIC.res=null; MIC.heard=""; render();
  let done=false;
  const finish=(res,heard)=>{
    if(done)return; done=true; clearTimeout(recTimer); clearTimeout(recHardTimer);
    MIC.state="idle"; MIC.res=res; MIC.heard=heard||"";
    if(res==="good")ding(true);
    render();
  };
  rec.onresult=e=>{
    try{
      const seg=e.results[e.results.length-1];
      const alts=[]; for(let i=0;i<seg.length;i++)alts.push(seg[i].transcript);
      const sc=bestScore(alts,target);
      finish(sc>=0.85?"good":sc>=0.5?"mid":"try",alts[0]);
    }catch(err){finish("retry","");}
  };
  rec.onerror=e=>{
    // iOS Safari throws transient errors (service-not-allowed / not-allowed /
    // network) after repeated use. NEVER disable the feature — just let her tap
    // to try again. "no-speech" means she stayed silent, so prompt to speak up.
    finish((e&&e.error==="no-speech")?"none":"retry","");
  };
  rec.onend=()=>{if(!done)finish("none","");};
  try{rec.start();}catch(e){finish("retry","");return;}
  recTimer=setTimeout(()=>{try{rec.stop();}catch(e){}},7000);
  recHardTimer=setTimeout(()=>finish("none",""),9500); // never get stuck on "Listening…" if no event fires
}
function micZone(w){
  const say=esc(w.en);
  if(MIC.state==="listening")
    return `<div class="mic-zone miconly"><div class="mic-res listening">🎤 ${T("Listening… say it now!","正在听……请说！")}</div></div>`;
  if(MIC.res){
    const again=`<button class="speak-btn" data-a="mic" data-say="${say}">🎤 ${T("Try again","再来一次")}</button>`;
    const hear=`<button class="speak-btn gold sndonly" data-a="say-slow" data-say="${say}">🔊 ${T("Hear it","听一听")}</button>`;
    if(MIC.res==="good")
      return `<div class="mic-zone miconly"><div class="mic-res good">🌟 ${T("Sounded great!","说得真棒！")}</div><div class="say-row">${again}</div></div>`;
    if(MIC.res==="mid")
      return `<div class="mic-zone miconly"><div class="mic-res mid">${T("So close! I heard:","很接近！我听到的是：")} “${esc(MIC.heard)}”</div><div class="say-row">${hear}${again}</div></div>`;
    if(MIC.res==="none")
      return `<div class="mic-zone miconly"><div class="mic-res try">${T("I didn't hear anything — hold the phone closer.","没听到声音——手机拿近一点。")}</div><div class="say-row">${again}</div></div>`;
    if(MIC.res==="retry")
      return `<div class="mic-zone miconly"><div class="mic-res try">${T("Hmm, that didn't work — tap to try again.","刚才没成功——点一下再试一次。")}</div><div class="say-row">${again}</div></div>`;
    return `<div class="mic-zone miconly"><div class="mic-res try">${T("Listen once more, then try again.","先再听一遍，然后再试一次。")}${MIC.heard?` ${T("I heard:","我听到的是：")} “${esc(MIC.heard)}”`:""}</div><div class="say-row">${hear}${again}</div></div>`;
  }
  return `<div class="mic-zone miconly"><button class="btn btn-soft" data-a="mic" data-say="${say}">🎤 ${T("Say it — I'll listen","跟读一下，我来听")}</button></div>`;
}

function shuffle(a){a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function startLesson(unitId){
  const u=UNIT[unitId]; if(!u)return;
  micReset();
  L={unit:u, words:u.words.map((w,i)=>WORD[u.id+":"+i]), i:0, stage:"learn", review:false};
  UI.screen="lesson"; render();
}
function startReview(){
  const ids=shuffle(dueWords()).slice(0,15);
  if(!ids.length)return;
  const words=ids.map(id=>WORD[id]);
  L={unit:null, words, i:0, stage:"quiz", review:true, q:makeQuiz(words,true)};
  UI.screen="review"; render();
}
function makeQuiz(words,isReview){
  const pick=shuffle(words).slice(0,Math.min(isReview?15:8,words.length));
  const types=isReview?["build","enzh","zhen","build","listen"]:["build","enzh","build","listen","build","zhen","build","enzh"];
  const qs=pick.map((w,i)=>{
    let t=types[i%types.length];
    const target=w.unit.level.id==="px"?w.en:w.eg;
    const tokens=target.split(" ");
    if(t==="build"&&(tokens.length<3||tokens.length>8||/—/.test(target)))t="enzh";
    if(!synth&&t==="listen")t="enzh";
    return {t,w,target};
  });
  return {qs,qi:0,right:0,wrong:0,answered:false,retry:[],retried:0,built:[],pool:[],fb:null};
}
function options(q){
  const isZh=q.t==="enzh";
  const val=w=>isZh?w.zh:w.en;
  const pool=shuffle(Object.values(WORD).filter(x=>x.id!==q.w.id));
  const sameUnit=pool.filter(x=>x.unit===q.w.unit);
  const opts=[q.w];
  for(const src of [sameUnit,pool]){
    for(const c of src){
      if(opts.length>=4)break;
      if(!opts.some(o=>val(o)===val(c)))opts.push(c);
    }
  }
  return shuffle(opts).map(o=>({txt:val(o),ok:o===q.w}));
}
function rLesson(){
  if(!L)return rHome();
  if(L.stage==="learn")return rLearn();
  if(L.stage==="quiz")return rQuiz();
  return rDone();
}

function rQuiz(){
  const Q=L.q,q=Q.qs[Q.qi],total=Q.qs.length+Q.retry.length;
  const pct=(Q.qi)/(Q.qs.length||1);
  let body="";
  const prompts={enzh:["What does this mean?","这是什么意思？"],zhen:["Which English word is this?","是哪个英文单词？"],listen:["What do you hear?","你听到了什么？"],build:["Put the sentence in order","把句子排好顺序"]};
  const P=prompts[q.t];
  if(q.t==="enzh"||q.t==="zhen"||q.t==="listen"){
    if(!q.opts)q.opts=options(q);
    let head="";
    if(q.t==="enzh")head=`<div class="q-word">${q.w.en}</div>
      <button class="speak-btn sndonly small" data-a="say" data-say="${esc(q.w.en)}">🔊 ${T("Hear it","听")}</button>`;
    if(q.t==="zhen")head=`<div class="q-word">${q.w.zh}</div>`;
    if(q.t==="listen")head=`<div class="say-row" style="margin:.4rem 0">
      <button class="speak-btn" data-a="say" data-say="${esc(q.w.en)}">🔊 ${T("Play again","再听一遍")}</button>
      <button class="speak-btn gold" data-a="say-slow" data-say="${esc(q.w.en)}">🐢 ${T("Slow","慢速")}</button></div>`;
    body=`${head}<div class="opts">
      ${q.opts.map((o,i)=>{
        let cls="opt";
        if(Q.answered){if(o.ok)cls+=" right"; else if(Q.pickedI===i)cls+=" wrong";}
        return `<button class="${cls}" data-a="ans:${i}" ${Q.answered?"disabled":""}>${o.txt}</button>`;
      }).join("")}
    </div>`;
  }else{ // build
    if(!q.tiles){q.tokens=q.target.split(" "); q.tiles=shuffle(q.tokens.map((t,i)=>({t,i})));
      if(q.tiles.map(x=>x.t).join(" ")===q.target)q.tiles.reverse();
      Q.built=[];}
    body=`
    <div class="card" style="padding:.8rem 1rem; margin-top:.6rem">
      <div class="eg-zh">${q.w.unit.level.id==="px"?q.w.zh:q.w.egZh}</div>
    </div>
    <div class="tilebox answer" aria-label="Your sentence">${Q.built.map((b,i)=>`<button class="tile" data-a="untile:${i}">${b.t}</button>`).join("")||`<span class="set-help">${T("Tap the words below in order","按顺序点下面的单词")}</span>`}</div>
    <div class="tilebox">${q.tiles.map((b,i)=>Q.built.includes(b)?"":`<button class="tile" data-a="tile:${i}">${b.t}</button>`).join("")}</div>`;
  }
  let fbMid="";
  if(Q.fb&&!Q.fb.ok){
    if(Q.fb.retryBuild){
      fbMid=Q.fb.showAns
        ?`<div class="fb-ans">${T("The right order is","正确的顺序是")}: ${Q.fb.ans}
            <button class="speak-btn sndonly small" data-a="say" data-say="${esc(Q.fb.say)}">🔊</button></div>`
        :`<div class="fb-ans">${T("Have another go — you can do it! 😊","再试一次，你可以的！😊")}
            <button class="speak-btn sndonly small" data-a="say" data-say="${esc(Q.fb.say)}">🔊 ${T("Hear it","听一听")}</button></div>`;
    }else{
      fbMid=`<div class="fb-ans">${T("Answer","正确答案")}: ${Q.fb.ans}
            <button class="speak-btn sndonly small" data-a="say" data-say="${esc(Q.fb.say)}">🔊</button></div>`;
    }
  }
  const fb=Q.fb?`
  <div class="feedback ${Q.fb.ok?"good":"bad"}"><div class="inner">
    <div class="fb-title">${Q.fb.ok?T("Correct! 🎉","答对了！"):(Q.fb.retryBuild?T("Not quite — try again","差一点，再试一次"):T("Not quite","再接再厉"))}</div>
    ${fbMid}
    <button class="fb-btn" data-a="${Q.fb.retryBuild?"redo":"cont"}">${Q.fb.retryBuild?T("Try again","再试一次"):T("Continue","继续")}</button>
  </div></div>`:"";
  return lessonTop(L.review?pct:(L.words.length? (L.words.length+Q.qi)/(L.words.length+Q.qs.length):pct))+`
  <div class="counter" style="text-align:center;margin-bottom:.4rem">${T(`Question ${Q.qi+1} of ${total}`,`第 ${Q.qi+1} 题，共 ${total} 题`)}</div>
  <div style="text-align:center"><div class="q-prompt">${P[0]}<span class="zh">${P[1]}</span></div>${body}</div>
  ${fb}
  <div style="height:9rem"></div>`;
}
function answer(ok,q){
  const Q=L&&L.q; if(!Q||Q.answered)return;
  if(Q.qs[Q.qi]!==q)return;
  const isBuild=q.t==="build";
  // Score each question only once, on the first attempt, so stats and review
  // scheduling reflect how she really did — retries don't change the score.
  if(!q.scored){
    q.scored=true;
    if(ok){Q.right++;}
    else{Q.wrong++;
      if(!isBuild&&!L.review&&!q.isRetry&&Q.retried<6){const copy={...q,opts:null,tiles:null,scored:false,isRetry:true}; Q.retry.push(copy); Q.retried++;}}
    applySRS(q.w.id,ok);
  }
  ding(ok);
  if(!ok&&S.set.sound)setTimeout(()=>speak(isBuild?q.target:q.w.en,.85),350);
  // Sentence reorder done wrong: don't move on — reset and let her rebuild it
  // until it's correct. Show the right order as a hint from the second try.
  if(isBuild&&!ok){
    q.wrongCount=(q.wrongCount||0)+1;
    Q.answered=true;
    Q.fb={ok:false,retryBuild:true,showAns:q.wrongCount>=2,ans:q.target,say:q.target};
    render(); return;
  }
  Q.answered=true;
  const ansTxt=q.t==="enzh"?q.w.zh:(isBuild?q.target:q.w.en);
  Q.fb={ok,ans:ansTxt,say:q.t==="enzh"?q.w.en:(isBuild?q.target:q.w.en)};
  render();
}
function continueQuiz(){
  const Q=L.q;
  Q.answered=false; Q.fb=null; Q.pickedI=null; Q.built=[];
  Q.qi++;
  if(Q.qi>=Q.qs.length){
    if(Q.retry.length){Q.qs.push(...Q.retry.splice(0));}
  }
  if(Q.qi>=Q.qs.length){finishLesson();return;}
  render();
}
function applySRS(id,ok){
  const t=today();
  const INT=[1,1,3,7,14,30,60];
  let w=S.words[id];
  if(!w){w=S.words[id]={b:1,due:""};}
  if(L.review){
    w.b=ok?Math.min(w.b+1,6):1;
  }else{
    if(!ok)w.b=1;
  }
  const d=day(INT[w.b]||1);
  w.due=ymd(d);
  save();
}
function finishLesson(){
  const Q=L.q;
  const total=Q.right+Q.wrong;
  const acc=total?Q.right/total:1;
  L.acc=acc; L.stage="done";
  const rec=dayRec();
  if(L.review){
    rec.r+=total;
  }else{
    const u=L.unit;
    L.words.forEach(w=>{if(!S.words[w.id]){S.words[w.id]={b:1,due:ymd(day(1))};}});
    const stars=acc>=.9?3:acc>=.65?2:1;
    const old=S.units[u.id]||{};
    S.units[u.id]={done:1,stars:Math.max(stars,old.stars||0)};
    rec.l+=1; rec.w+=L.words.length;
    L.stars=stars;
  }
  save(); render();
}

function chartSVG(){
  const days=[]; for(let i=6;i>=0;i--){const d=day(-i); const r=S.days[ymd(d)]||{};
    days.push({d,min:Math.round((r.s||0)/60),w:(r.w||0)+(r.r||0)});}
  const goal=S.set.goal;
  const maxV=Math.max(goal,...days.map(x=>x.min));
  const nice=[10,15,20,30,45,60,90,120,180,240].find(n=>n>=maxV)||Math.ceil(maxV/60)*60;
  const W=340,H=168,padL=30,padR=10,top=16,base=126;
  const plotW=W-padL-padR, slot=plotW/7, bw=22;
  const y=v=>base-(v/nice)*(base-top);
  let bars="",labels="",hits="";
  days.forEach((x,i)=>{
    const cx=padL+slot*i+slot/2, bx=cx-bw/2;
    const h=Math.max(x.min>0?6:4,base-y(x.min));
    const by=base-h;
    const isToday=i===6, sel=UI.chartSel===i;
    const fill=x.min>0?(isToday?"var(--accent)":"var(--bar)"):"var(--surface2)";
    const r=4;
    bars+=`<path d="M${bx} ${base} L${bx} ${by+r} Q${bx} ${by} ${bx+r} ${by} L${bx+bw-r} ${by} Q${bx+bw} ${by} ${bx+bw} ${by+r} L${bx+bw} ${base} Z" fill="${fill}" ${sel?'stroke="var(--ink)" stroke-width="1.5"':""}/>`;
    if(isToday&&x.min>0)labels+=`<text x="${cx}" y="${by-6}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">${x.min}</text>`;
    const wd=x.d.getDay();
    labels+=`<text x="${cx}" y="${base+16}" text-anchor="middle" font-size="11" font-weight="${isToday?"800":"700"}" fill="${isToday?"var(--ink)":"var(--muted)"}">${WD_EN[wd].slice(0,3)}</text>`;
    if(S.set.zh)labels+=`<text x="${cx}" y="${base+31}" text-anchor="middle" font-size="10" fill="var(--muted)">${WD_ZH[wd].slice(2)}</text>`;
    hits+=`<rect x="${padL+slot*i}" y="${top-10}" width="${slot}" height="${base-top+24}" fill="transparent" data-a="bar:${i}" style="cursor:pointer"/>`;
  });
  const gy=y(goal);
  const sel=days[UI.chartSel]||days[6];
  const selWd=sel.d.getDay();
  return `
  <div class="chart-readout">${UI.chartSel===6?"Today":WD_EN[selWd]}<span class="zh inline">${UI.chartSel===6?"今天":WD_ZH[selWd]}</span> ·
    <b>${sel.min} min</b><span class="zh inline">分钟</span> · <b>${sel.w}</b> ${T2("words practised","练习单词")}</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutes practised in the last 7 days">
    <line x1="${padL}" y1="${y(nice)}" x2="${W-padR}" y2="${y(nice)}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${padL}" y1="${y(nice/2)}" x2="${W-padR}" y2="${y(nice/2)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL-5}" y="${y(nice)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${nice}</text>
    <text x="${padL-5}" y="${y(nice/2)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${nice/2}</text>
    <text x="${padL-5}" y="${base+4}" text-anchor="end" font-size="10" fill="var(--muted)">0</text>
    ${bars}
    <line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--gold)" stroke-width="1.5"/>
    <text x="${W-padR}" y="${gy-5}" text-anchor="end" font-size="10" font-weight="800" fill="var(--gold)">goal${S.set.zh?" 目标":""} ${goal}</text>
    <line x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>
    ${labels}${hits}
  </svg>`;
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");
  if(!el)return;
  prime();
  const [a,arg]=el.dataset.a.split(/:(.*)/s);
  const Q=L&&L.q;
  switch(a){
    case "tab": L=null; micReset(); UI.tab=arg; UI.screen=arg; UI.chartSel=6; render(); break;
    case "mic": startListen(el.dataset.say||(L&&L.words[L.i]?L.words[L.i].en:"")); break;
    case "settings": UI.screen="settings"; UI.confirmReset=0; render(); break;
    case "w": if(arg==="done"){S.first=0; save(); UI.screen="home"; UI.tab="home";} else UI.wstep=+arg; render(); break;
    case "wlevel": S.set.level=arg; save(); UI.wstep=2; render(); break;
    case "wgoal": S.set.goal=+arg; save(); render(); break;
    case "openlevel": UI.screen="units"; UI.level=arg; UI.tab="levels"; render(); break;
    case "start": startLesson(arg); break;
    case "review": startReview(); break;
    case "exit": exitLesson(); break;
    case "learn":
      micReset();
      if(arg==="next"){ if(L.i+1<L.words.length){L.i++;} else {L.stage="quiz"; L.q=makeQuiz(L.words,false);} render(); }
      else if(arg==="prev"&&L.i>0){L.i--; render();}
      break;
    case "say": speak(el.dataset.say); break;
    case "say-slow": speak(el.dataset.say,.55); break;
    case "ans": {
      const q=Q.qs[Q.qi]; Q.pickedI=+arg;
      answer(q.opts[+arg].ok,q); break;}
    case "tile": {
      const q=Q.qs[Q.qi]; const b=q.tiles[+arg];
      if(!Q.built.includes(b)){Q.built.push(b); render();
        if(Q.built.length===q.tokens.length){
          const ok=Q.built.map(x=>x.t).join(" ")===q.target;
          setTimeout(()=>answer(ok,q),250);
        }}
      break;}
    case "untile": if(!Q.answered){Q.built.splice(+arg,1); render();} break;
    case "cont": continueQuiz(); break;
    case "redo": Q.answered=false; Q.fb=null; Q.built=[]; render(); break;
    case "bar": UI.chartSel=+arg; render(); break;
    case "set": {
      const [k,v]=arg.split(/:(.*)/s);
      if(k==="zh")S.set.zh=+v;
      if(k==="big")S.set.big=+v;
      if(k==="sound")S.set.sound=+v;
      if(k==="rate")S.set.rate=+v;
      if(k==="mic")S.set.mic=+v;
      if(k==="goal")S.set.goal=+v;
      if(k==="level")S.set.level=v;
      save(); render(); break;}
    case "reset":
      if(arg==="ask"){UI.confirmReset=1; render();}
      if(arg==="no"){UI.confirmReset=0; render();}
      if(arg==="yes"){try{localStorage.removeItem(KEY);}catch(e){} S=clone(DEFAULTS); UI.confirmReset=0; UI.wstep=0; UI.screen="welcome"; render();}
      break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="remind-time"){
    S.set.remind=e.target.value||"09:00"; S.set.remindSet=1; save();
    if(UI.screen==="settings")render();
  }
});
document.addEventListener("click",e=>{
  if(e.target.closest("[data-a-link]")){S.set.remindSet=1; save();}
});

/* ---------- active-time tracking ---------- */
setInterval(()=>{
  if(document.visibilityState!=="visible"||S.first||UI.screen==="welcome")return;
  const r=dayRec(); r.s=(r.s||0)+15;
  if(!r.g && Math.floor(r.s/60)>=S.set.goal){
    r.g=1; toast("🎉 Daily goal reached!<span class='zh'>达成今日目标！</span>");
  }
  save();
},15000);

/* ---------- boot ---------- */
injectIcons();
UI.icsOk=false;
if(/^https?:$/.test(location.protocol)){
  fetch("reminders/daily-0900.ics",{method:"HEAD"}).then(r=>{
    if(r.ok){UI.icsOk=true; if(UI.screen==="settings")render();}
  }).catch(e=>{});
}
if(!S.created){S.created=today(); save();}
if(S.first){UI.screen="welcome";}
render();
</script>
</body></html>
